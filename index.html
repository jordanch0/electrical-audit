<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>SparkCheck | Electrical Audit</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      touch-action: pan-x pan-y;
    }
    /* Prevent iOS auto-zoom on input focus */
    input, textarea, select {
      font-size: 16px !important;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      height: 100%;
      overflow: hidden;
    }
    /* Use position fixed so layout never depends on parent height chain */
    #root {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      background: #111;
      overflow: hidden;
      padding-top: var(--sat, env(safe-area-inset-top, 0px));
    }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e8731a;
      font-family: sans-serif;
      z-index: 9999;
    }
    .logo { font-size: 52px; font-weight: 900; letter-spacing: -2px; }
    .sub { font-size: 13px; color: #555; margin-top: 6px; letter-spacing: 1px; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #222;
      border-top-color: #e8731a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 28px;
    }
    #status { font-size: 11px; color: #444; margin-top: 12px; padding: 0 20px; text-align: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">SparkCheck</div>
    <div class="sub">ELECTRICAL AUDIT SOFTWARE</div>
    <div class="spinner"></div>
    <div id="status">Loading...</div>
  </div>
  <div id="root"></div>

  <script>
    function ss(m) { var e = document.getElementById('status'); if (e) e.textContent = m; }
    function showErr(t, m) {
      document.body.innerHTML = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;padding:30px;font-family:sans-serif;background:#111;color:#eee;overflow:auto"><h2 style="color:#e8731a">' + t + '</h2><pre style="color:#f87171;white-space:pre-wrap;font-size:13px">' + m + '</pre></div>';
    }
    window.onerror = function(msg, src, line, col, err) {
      showErr('Error line ' + line, msg + (err ? '\n\n' + err.stack : ''));
      return true;
    };
    window.addEventListener('unhandledrejection', function(e) {
      showErr('Promise Error', String(e.reason));
    });
    window.__hideLoading = function() {
      var el = document.getElementById('loading');
      if (el) { el.style.transition = 'opacity 0.3s'; el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 300); }
    };
    setTimeout(function() { window.__hideLoading(); }, 5000);

    ss('Loading React...');
  </script>

  <script src="react.js"></script>
  <script>
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
      showErr('React failed', 'react.js did not load correctly.');
    } else { ss('Loading XLSX...'); }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
    onerror="window.XLSX=window.XLSX||{utils:{book_new:()=>({}),aoa_to_sheet:()=>({}),book_append_sheet:()=>{},sheet_to_json:()=>[]},write:()=>'',read:()=>({Sheets:{},SheetNames:[]})};"></script>

  <script>ss('Loading app...');</script>
  <script src="app.js"></script>
</body>
</html>
