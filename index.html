<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="manifest" href="/electrical-audit/manifest.json"/>
  <title>SparkCheck | Electrical Audit</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      touch-action: pan-x pan-y;
    }
    /* Prevent iOS auto-zoom on input focus */
    input, textarea, select {
      font-size: 16px !important;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      height: 100%;
      overflow: hidden;
    }
    /* Use position fixed so layout never depends on parent height chain.
       top/height track window.visualViewport (see script below) so the app's
       bottom nav stays pinned to the true visible bottom edge instead of
       floating above the iOS keyboard when it opens. */
    #root {
      position: fixed;
      top: var(--vv-top, 0px);
      left: 0;
      right: 0;
      height: var(--vv-height, 100%);
      display: flex;
      flex-direction: column;
      background: #111;
      overflow: hidden;
      padding-top: var(--sat, env(safe-area-inset-top, 0px));
    }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e8731a;
      font-family: sans-serif;
      z-index: 9999;
    }
    .logo { font-size: 52px; font-weight: 900; letter-spacing: -2px; }
    .sub { font-size: 13px; color: #555; margin-top: 6px; letter-spacing: 1px; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #222;
      border-top-color: #e8731a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 28px;
    }
    #status { font-size: 11px; color: #444; margin-top: 12px; padding: 0 20px; text-align: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">SparkCheck</div>
    <div class="sub">ELECTRICAL AUDIT SOFTWARE</div>
    <div class="spinner"></div>
    <div id="status">Loading...</div>
  </div>
  <div id="root"></div>

  <script>
    // Keep #root sized/positioned to the true visible viewport (window.visualViewport)
    // rather than the layout viewport. On iOS Safari the layout viewport does not
    // shrink when the keyboard opens, so a `position:fixed; bottom:0` element can
    // end up floating above the keyboard instead of below the fold. Tying #root's
    // top/height to visualViewport keeps the bottom nav pinned to the real bottom.
    (function () {
      function syncViewport() {
        var vv = window.visualViewport;
        var root = document.documentElement;
        if (vv) {
          root.style.setProperty('--vv-height', vv.height + 'px');
          root.style.setProperty('--vv-top', vv.offsetTop + 'px');
        } else {
          root.style.setProperty('--vv-height', window.innerHeight + 'px');
          root.style.setProperty('--vv-top', '0px');
        }
      }
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewport);
        window.visualViewport.addEventListener('scroll', syncViewport);
      }
      window.addEventListener('resize', syncViewport);
      syncViewport();
    })();
    function showErr(t, m) {
      document.body.innerHTML = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;padding:30px;font-family:sans-serif;background:#111;color:#eee;overflow:auto"><h2 style="color:#e8731a">' + t + '</h2><pre style="color:#f87171;white-space:pre-wrap;font-size:13px">' + m + '</pre></div>';
    }
    window.onerror = function(msg, src, line, col, err) {
      showErr('Error line ' + line, msg + (err ? '\n\n' + err.stack : ''));
      return true;
    };
    window.addEventListener('unhandledrejection', function(e) {
      showErr('Promise Error', String(e.reason));
    });
    window.__hideLoading = function() {
      var el = document.getElementById('loading');
      if (el) { el.style.transition = 'opacity 0.3s'; el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 300); }
    };
    setTimeout(function() { window.__hideLoading(); }, 5000);
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
