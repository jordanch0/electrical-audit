<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>SparkCheck | Electrical Audit</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      touch-action: pan-x pan-y;
    }
    /* Prevent iOS auto-zoom on input focus */
    input, textarea, select {
      font-size: 16px !important;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #e8e6e2;
      height: 100%;
      /* iOS standalone (measured on an iPhone, 2026-10-01): "100%" resolved to 879pt on a 926pt screen, and the
         WEB VIEW itself followed it - innerHeight 879, anything below that line never painted, so the floating
         pill sat 47pt too high with a blank strip under it. Setting 100vh (926 there) makes the web view fill
         the screen (innerHeight 926). The 100% line stays as the fallback for browsers without vh. #root is
         position:fixed so desktop / Safari-tab layout is unaffected by this. */
      height: 100vh;
      overflow: hidden;
    }
    /* Use position fixed so layout never depends on parent height chain */
    #root {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      background: #e8e6e2;
      overflow: hidden;
      padding-top: var(--sat, env(safe-area-inset-top, 0px));
    }
    /* The floating pill nav NEVER depends on the keyboard position (2026-10-01):
       it stays anchored at its normal bottom position and is simply HIDDEN while
       a text field is focused (html.kb-open, toggled by the script below). The
       old --kb-inset margin-bottom lifted the pill with the keyboard and could
       be left stale (pill stranded mid-screen) on iOS - it is gone, and nothing
       may read or set --kb-inset any more. */
    #root nav {
      transition: opacity 0.15s ease;
    }
    html.kb-open #root nav {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #e8e6e2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #a3530f;
      font-family: sans-serif;
      z-index: 9999;
    }
    .logo { font-size: 52px; font-weight: 900; letter-spacing: -2px; }
    .sub { font-size: 13px; color: #5f5b57; margin-top: 6px; letter-spacing: 1px; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e4e4e7;
      border-top-color: #a3530f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 28px;
    }
    #status { font-size: 11px; color: #52525b; margin-top: 12px; padding: 0 20px; text-align: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Placeholder text (2026-10-03): the browser default (#757575, ~3.7:1 on the page) is below 4.5:1. #66625e is >= 4.7:1 on the page, cards, red / grey tints; opacity 1 stops Firefox dimming it. */
    ::placeholder { color: #66625e; opacity: 1; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">SparkCheck</div>
    <div class="sub">ELECTRICAL AUDIT SOFTWARE</div>
    <div class="spinner"></div>
    <div id="status">Loading...</div>
  </div>
  <div id="root"></div>

  <script>
    // Keyboard handling for the floating pill nav (2026-10-01). The pill is ALWAYS anchored at its normal
    // bottom position and never moves with the keyboard. While a text field is focused (= the on-screen
    // keyboard is up) the pill is hidden instead (html.kb-open -> opacity 0 + pointer-events none, see the CSS
    // above) and it returns when focus leaves the field.
    //
    // This REPLACES the old --kb-inset scheme (a margin-bottom on the nav computed from
    // window.innerHeight - visualViewport.height, with a resting-baseline workaround). On a real iPhone that
    // lifted the pill with the keyboard, and tapping a nav icon with the keyboard up closed the keyboard
    // WITHOUT a final viewport event, leaving --kb-inset stale and the pill stranded mid-screen. Nothing sets
    // or reads --kb-inset any more; the line below just clears any leftover value from an older session.
    //
    // Sync is derived from document.activeElement every time, never from a remembered flag, so the class
    // cannot get stuck: it is re-evaluated on focusin, focusout, blur, visualViewport resize/scroll (backup),
    // pagehide / visibilitychange, and when a nav button is pressed.
    (function () {
      var root = document.documentElement;
      root.style.removeProperty('--kb-inset');
      var NO_KEYBOARD = { button: 1, checkbox: 1, radio: 1, range: 1, file: 1, submit: 1, reset: 1, image: 1, color: 1 };
      function isTextEntry(el) {
        if (!el || el === document.body) return false;
        var tag = el.tagName;
        if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
        if (tag === 'INPUT') return !NO_KEYBOARD[(el.type || 'text').toLowerCase()];
        return !!el.isContentEditable;
      }
      function sync() {
        var open = isTextEntry(document.activeElement);
        if (open) root.classList.add('kb-open'); else root.classList.remove('kb-open');
        root.style.removeProperty('--kb-inset');
      }
      // iOS usually scrolls a focused field above the keyboard itself; this is a backup for fields near the
      // bottom of a scroll area (waits for the keyboard animation, then only acts if the field is covered).
      function keepVisible(el) {
        setTimeout(function () {
          if (document.activeElement !== el) return;
          var vv = window.visualViewport;
          var visibleBottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
          var r = el.getBoundingClientRect();
          if (r.bottom > visibleBottom - 12 || r.top < (vv ? vv.offsetTop : 0)) {
            try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
          }
        }, 350);
      }
      document.addEventListener('focusin', function (e) { sync(); if (isTextEntry(e.target)) keepVisible(e.target); });
      // focusout fires BEFORE the next field takes focus - wait a tick so moving between fields doesn't flash
      document.addEventListener('focusout', function () { setTimeout(sync, 50); });
      window.addEventListener('blur', sync);
      window.addEventListener('pagehide', sync);
      document.addEventListener('visibilitychange', sync);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', sync);
        window.visualViewport.addEventListener('scroll', sync);
      }
      window.addEventListener('resize', sync);
      // A nav button press (capture phase, before the click): drop focus so the keyboard dismisses, and show
      // the pill right away. The tab switch itself is the button's own click handler.
      function onNavPress(e) {
        var t = e.target;
        if (!t || !t.closest || !t.closest('#root nav')) return;
        var a = document.activeElement;
        if (a && a !== document.body && a.blur) a.blur();
        sync();
      }
      document.addEventListener('pointerdown', onNavPress, true);
      document.addEventListener('touchstart', onNavPress, true);
      sync();
    })();
    function showErr(t, m) {
      document.body.innerHTML = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;padding:30px;font-family:sans-serif;background:#e8e6e2;color:#18181b;overflow:auto"><h2 style="color:#a3530f">' + t + '</h2><pre style="color:#991b1b;white-space:pre-wrap;font-size:13px">' + m + '</pre></div>';
    }
    window.onerror = function(msg, src, line, col, err) {
      showErr('Error line ' + line, msg + (err ? '\n\n' + err.stack : ''));
      return true;
    };
    window.addEventListener('unhandledrejection', function(e) {
      showErr('Promise Error', String(e.reason));
    });
    window.__hideLoading = function() {
      var el = document.getElementById('loading');
      if (el) { el.style.transition = 'opacity 0.3s'; el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 300); }
    };
    setTimeout(function() { window.__hideLoading(); }, 5000);
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
